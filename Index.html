<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <H1>Senai</H1>
    <script>
        console.log("Olá você!")
        alert("Olá você!")
        // "10" -> 10

        let num_one = Number(prompt("digite o primeiro numero"))
        let num_two = Number(prompt("digite o segundo numero"))


        let sum = num_one + num_two
        alert(sum)
        console.log("soma", sum)

        let sub = num_one - num_two 
        console.log("subtração", sub)

        let mult = num_one * num_two
        console.log("multiplicação", mult)

        let div = num_one / num_two
        console.log("divisão", div)

        let pot = num_one ** num_two
        console.log("potenciação", pot)

    </script>

</body>
</html>
